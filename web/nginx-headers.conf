# Security headers shared by every location (nginx does not inherit add_header into a
# location that sets its own, so each one includes this file).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# Scripts only from this origin; styles allow inline attributes (map popups and MapLibre);
# map tiles, glyphs and sprites come from OpenFreeMap; workers are blob: (MapLibre).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
