# Runs in the unprivileged nginx image: listens on 8080 as a non-root user.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=streams:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  # the API is read-only, nothing is ever uploaded
  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;

  include /etc/nginx/includes/headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Server-sent events: no buffering, long-lived, a handful per client
  location = /api/stream {
    limit_conn streams 6;
    include /etc/nginx/includes/headers.conf;
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;
    include /etc/nginx/includes/headers.conf;
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/includes/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
