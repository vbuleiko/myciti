services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - myciti-data:/data
    restart: unless-stopped
    # uncomment to expose the API directly
    # ports:
    #   - "3000:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  myciti-data:
